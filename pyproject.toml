[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    # PassiveAggressiveClassifier is deprecated in scikit-learn 1.8 and
    # scheduled for removal in 1.10, so cap it until train.py migrates.
    "scikit-learn>=1.3.1,<1.10",
    "fire",
    "pandas",
    "onnxruntime",
    "transformers>=4.44",
    "joblib",
    "numpy>=1.26",
    "rich>=13.7.0",
    "onnx_embedding_models>=0.0.16",
    # openai was pinned to ==1.46.1, which cannot start with httpx>=0.28
    # (AsyncClient got an unexpected keyword argument 'proxies').
    # Use a lower bound on the first release that supports httpx 0.28 instead.
    "openai>=1.58.1",
    "httpx>=0.27",
    "pyyaml",
]
name = "aiq-cli"
version = "0.1.2"
description = "Train classification models from the command line."
authors = [{ name = "Benjamin Anderson" }]
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiq = "aiq.aiq:main"
